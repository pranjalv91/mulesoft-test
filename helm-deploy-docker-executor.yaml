.upgrade_helm_testing_delimiter:
    script: |
        # Define the exact GitLab log colors
        GL_GREEN='\033[32;1m'
        GL_RESET='\033[0m'

        echo -e "${GL_GREEN}Sourcing release_info.env file...${GL_RESET}"
        source release_info.env
        echo "Release number is $RELEASE_NUMBER"

        echo " "
        echo -e "${GL_GREEN}Cloning blueprint repository for scripts...${GL_RESET}"
        # Adjust the URL to your actual GitLab repository URL
        git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.yourdomain.com/centraliseddevsecops/eis_2.0/eis2.0_blueprint1.0.git blueprint_repo

git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sbi/centraliseddevops/eis2.0/eis2.0_blueprint1.0.git blueprint_repo

        
        echo " "
        echo -e "${GL_GREEN}Generate helm values.yaml files for all nonprod envs...${GL_RESET}"
        chmod 755 blueprint_repo/scripts/$HELM_SCRIPT_NAME
        ./blueprint_repo/scripts/$HELM_SCRIPT_NAME

        echo " "
        echo -e "${GL_GREEN}Update the placeholders in values.yaml using sed commands...${GL_RESET}"
        chmod 755 blueprint_repo/scripts/update_yaml.sh
        ./blueprint_repo/scripts/update_yaml.sh

        echo " "
        echo -e "${GL_GREEN}Export kubeconfig file to login to $ENV cluster...${GL_RESET}"
        # Point to the GitLab File Variable instead of the host disk
        export KUBECONFIG=$DEV_KUBECONFIG_CONTENT

        echo " "
        echo -e "${GL_GREEN}Pull the chart from Harbor and unpack it into a local folder...${GL_RESET}"
        helm pull oci://${HARBOR_REGISTRY}/eis2.0/mule-journey --version $SBI_MULE_HELM_VERSION --untar --insecure-skip-tls-verify

        echo " "
        echo -e "${GL_GREEN}Use 'sed' to forcefully overwrite the appVersion in the downloaded Chart.yaml...${GL_RESET}"
        sed -i "s/^appVersion:.*/appVersion: \"$RELEASE_NUMBER\"/" mule-journey/Chart.yaml

        echo " "
        echo -e "${GL_GREEN}Run the upgrade command...${GL_RESET}"
        helm upgrade --install "$RELEASE_NAME" ./mule-journey --namespace $NAMESPACE --insecure-skip-tls-verify -f $FILE_NAME

        echo " "
        echo -e "${GL_GREEN}Cleaning up local mule-journey chart...${GL_RESET}"
        rm -rf ./mule-journey blueprint_repo

        echo " "
        echo -e "${GL_GREEN}Wait for $DEPLOY_JOB_SLEEP seconds...${GL_RESET}"
        sleep $DEPLOY_JOB_SLEEP

        echo " "
        echo -e "${GL_GREEN}View helm revision details...${GL_RESET}"
        helm list --filter $RELEASE_NAME -n $NAMESPACE

        echo " "
        echo -e "${GL_GREEN}View status of pods...${GL_RESET}"
        kubectl get pods -n $NAMESPACE | grep $RELEASE_NAME


deploy_job:
  image: artifactory.jfrog.sbi:443/dso-base-image/ubi9/ubi9-podman-git-python-helm-jinja-mvn-3.9.11-jdk-11.0.26@sha256:...
  before_script:
    # 1. Decode the base64 string and save it as a physical file in the container
    - echo "$INTERNAL_CA_CERT_B64" | base64 -d > /tmp/internal-ca.crt
    
    # 2. Tell Git to use this decoded file for SSL verification
    - git config --global http.sslCAInfo /tmp/internal-ca.crt
  script:
    - source release_info.env
    - git clone https://oauth2:glpat-[MASKED]@gitlab.sbi/centraliseddevsecops/eis_2.0/eis2.0_blueprint1.0.git blueprint_repo


deploy_job:
  image: artifactory.jfrog.sbi:443/dso-base-image/ubi9/ubi9-podman...
  before_script:
    - echo "$INTERNAL_CA_CERT_B64" | base64 -d > /tmp/internal-ca.crt
    - git config --global http.sslCAInfo /tmp/internal-ca.crt
    
    # Configure identity for automated commits
    - git config --global user.name "GitLab CI Bot"
    - git config --global user.email "ci-bot@gitlab.sbi"
  script:
    - source release_info.env
    - git clone https://oauth2:glpat-[MASKED]@gitlab.sbi/... blueprint_repo


deploy_job:
  image: artifactory.jfrog.sbi:443/dso-base-image/ubi9/ubi9-podman-git-python-helm-jinja-mvn-3.9.11-jdk-11.0.26@sha256:...
  variables:
    # Set Git and Curl to use the combined bundle created in before_script
    GIT_SSL_CAINFO: "/tmp/combined-ca-bundle.crt"
    SSL_CERT_FILE: "/tmp/combined-ca-bundle.crt"

  before_script:
    # 1. Decode your corporate CA into /tmp
    - echo "$INTERNAL_CA_CERT_B64" | base64 -d > /tmp/internal-ca.crt

    # 2. Append your internal CA to UBI's existing system bundle
    - cat /etc/pki/tls/certs/ca-bundle.crt /tmp/internal-ca.crt > /tmp/combined-ca-bundle.crt

    # 3. Configure identity for automated commits
    - git config --global user.email "gitlab-runner@sbi.co.in"
    - git config --global user.name "gitlab-runner"

  script:
    - source release_info.env
    - git clone https://oauth2:glpat-[MASKED]@gitlab.sbi/centraliseddevsecops/eis_2.0/eis2.0_blueprint1.0.git blueprint_repo

xray_job:
  before_script:
    - echo "Configuring JFrog CLI..."
    - echo "$JFROG_ACCESS_TOKEN" | jf config add default-server --url="$JFROG_URL" --access-token-stdin --interactive=false --insecure-tls
  script:
    - jf scan my-app.jar

#This job is used by all internal and external journeys to run a scan on the generated artifact
.xray_docker_executor_job:
    #This rule implies that the job will only run when the pipeline is triggered due to code merge or if the code is commited to dev branch and if the changes are inside the app directory
    rules:
        - if: '( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_REF_NAME =~ /^feature-/ ) || ( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_REF_NAME =~ /^hotfix-/ ) || ( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == "dev" )'
          changes:
            - "$APP_DIR/**"
            - "$APP_DIR/**/*"
    before_script: |
        echo "Configuring JFrog CLI..."
        echo "$JFROG_UPLOAD_ACCESS_TOKEN" | jf config add default-server --url="$JFROG_CONFIG_URL" --user="$JFROG_UPLOAD_USER" --access-token-stdin --interactive=false --insecure-tls
    script: |
        echo "Printing values of Xray Scan Variables..."
        echo "BASE_M2_PATH=$BASE_M2_PATH"
        echo "GROUP_ID=$GROUP_ID"
        echo "APP_NAME=$APP_NAME"
        echo "APP_VERSION=${!APP_VER}"
        
        echo " "
        echo "Constructing the build path..."
        BUILD_PATH="${BASE_M2_PATH}/${GROUP_ID}/${APP_NAME}/${!APP_VER}/*.jar"
        
        echo " "
        echo "Running xray scan locally on the runner..."
        jf scan $BUILD_PATH --watches=EIS2.0 --fail=true #scans the artifact=$BUILD_PATH using the policy defined in watches=EIS2.0. fails the pipeline if the scan returns not 0
        echo " "

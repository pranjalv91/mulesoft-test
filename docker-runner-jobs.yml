.fortify_scan_updated:
  image: artifactory.jfrog.sbi:443/dso-base-image/ubi9/ubi9-java17-fortify-24.4:2.0
  rules:
    - if: '( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_REF_NAME =~ /^feature-/ ) || ( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_REF_NAME =~ /^hotfix-/ ) || ( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == "dev" )'
      changes:
        - "$APP_DIR/**"
        - "$APP_DIR/**/*"
  variables:
    MAVEN_OPTS: "-Xmx4g -Xms2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DskipTests"
  before_script:
    - |
      cd "$APP_DIR"
      keytool -import -alias jfrog-artifactory -file "$ARTIFACTORY_CERT" \
        -keystore /home/default/custom-truststore.jks -storepass changeit -noprompt
      export MAVEN_OPTS="${MAVEN_OPTS} \
        -Djavax.net.ssl.trustStore=/home/default/custom-truststore.jks \
        -Djavax.net.ssl.trustStorePassword=changeit"
  script:
    - sourceanalyzer -clean -b $APP_NAME
    - sourceanalyzer -b $APP_NAME mvn $MAVEN_CLI_OPTS clean compile -U -DskipTests=true -Dfortify.sca.exclude=target
      # Check for the suppression file and scan accordingly
    - |
      if [ -f "$CI_PROJECT_DIR/fortify_filter.txt" ]; then
        echo "Suppression file found. Applying filters..."
        sourceanalyzer -b $APP_NAME -scan -Xmx8G -filter $CI_PROJECT_DIR/fortify_filter.txt -f ${APP_NAME}.fpr
      else
        echo "No fortify_filter.txt found in the repository. Running unfiltered scan..."
        sourceanalyzer -b $APP_NAME -scan -Xmx8G -f ${APP_NAME}.fpr
      fi
    - BIRTReportGenerator -template "Developer Workbook" -source ${APP_NAME}.fpr -format pdf -output ${APP_NAME}_report.pdf
    # Run separate queries for each severity level
    - FPRUtility -information -listIssues -search -query "[fortify priority order]:critical" -project ${APP_NAME}.fpr > sca_critical.txt
    - FPRUtility -information -listIssues -search -query "[fortify priority order]:high" -project ${APP_NAME}.fpr > sca_high.txt
    - FPRUtility -information -listIssues -search -query "[fortify priority order]:medium" -project ${APP_NAME}.fpr > sca_medium.txt
    - FPRUtility -information -listIssues -search -query "[fortify priority order]:low" -project ${APP_NAME}.fpr > sca_low.txt
    # Extract the counts
    - CRITICAL_ISSUES=$(grep -i "matched search query" sca_critical.txt | awk '{print $1}')
    - HIGH_ISSUES=$(grep -i "matched search query" sca_high.txt | awk '{print $1}')
    - MEDIUM_ISSUES=$(grep -i "matched search query" sca_medium.txt | awk '{print $1}')
    - LOW_ISSUES=$(grep -i "matched search query" sca_low.txt | awk '{print $1}')
    - |
      # Ensure variables default to 0 if grep returns empty, preventing mathematical errors
      CRITICAL_ISSUES=${CRITICAL_ISSUES:-0}
      HIGH_ISSUES=${HIGH_ISSUES:-0}
      MEDIUM_ISSUES=${MEDIUM_ISSUES:-0}
      LOW_ISSUES=${LOW_ISSUES:-0}
      
      # Calculate total
      TOTAL_ISSUES=$((CRITICAL_ISSUES + HIGH_ISSUES + MEDIUM_ISSUES + LOW_ISSUES))
      
      if [ "$TOTAL_ISSUES" -gt 0 ]; then
        echo -e "\e[31m=========================================\e[0m"
        echo -e "\e[31m QUALITY GATE FAILED\e[0m"
        echo -e "\e[31m Total Vulnerabilities: $TOTAL_ISSUES\e[0m"
        echo -e "\e[31m  - Critical: $CRITICAL_ISSUES\e[0m"
        echo -e "\e[31m  - High:     $HIGH_ISSUES\e[0m"
        echo -e "\e[31m  - Medium:   $MEDIUM_ISSUES\e[0m"
        echo -e "\e[31m  - Low:      $LOW_ISSUES\e[0m"
        echo -e "\e[31m=========================================\e[0m"
        exit 1
      else
        echo -e "\e[32m=========================================\e[0m"
        echo -e "\e[32m QUALITY GATE PASSED\e[0m"
        echo -e "\e[32m Total Vulnerabilities: 0\e[0m"
        echo -e "\e[32m=========================================\e[0m"
      fi
  artifacts:
    paths:
      - "$APP_DIR/${APP_NAME}_report.pdf"
      - "$APP_DIR/${APP_NAME}.fpr"
    expire_in: 1 day
    when: always


.fortifytoGitlab:
  image: artifactory.jfrog.sbi:443/dso-docker-base-images/py-fortify:0.0.1
  rules:
    - if: '( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_REF_NAME =~ /^feature-/ ) || ( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_REF_NAME =~ /^hotfix-/ ) || ( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == "dev" )'
      changes:
        - "$APP_DIR/**"
        - "$APP_DIR/**/*"  
  before_script:
    - cd "$APP_DIR"
    - git config --global http.sslVerify false
  script:
    - echo ${CLONE_TOKEN}
    - git clone https://oauth2:${CLONE_TOKEN}@gitlab.sbi/centraliseddevsecops/common-utility/utility.git
    - ls -lhrt
    - python3 utility/script/fortify_to_gitlab.py ${APP_NAME}.fpr
  artifacts:
    reports:
      sast: "$APP_DIR/gl-sast-report.json"
    paths:
      - "$APP_DIR/gl-sast-report.json"
      - "$APP_DIR/${APP_NAME}.fpr"


.xray_docker_executor_job:
    # This rule implies that the job will only run when the pipeline is triggered due to code merge or if the code is committed to dev branch and if the changes are inside the app directory
    rules:
        - if: '( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_REF_NAME =~ /^feature-/ ) || ( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_REF_NAME =~ /^hotfix-/ ) || ( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == "dev" )'
          changes:
            - "$APP_DIR/**"
            - "$APP_DIR/**/*"
    before_script: |
        echo "Configuring JFrog CLI..."
        echo "$JFROG_UPLOAD_ACCESS_TOKEN" | jf config add default-server --url="$JFROG_CONFIG_URL" --user="$JFROG_UPLOAD_USER" --access-token-stdin --interactive=false --insecure-tls
        echo " "
    script: |
        echo "Printing values of Xray Scan Variables..."
        echo "APP_DIR=$APP_DIR"
        echo "APP_NAME=$APP_NAME"
        
        # POSIX-compliant indirect expansion
        APP_VERSION=$(eval echo "\$$APP_VER")
        echo "APP_VERSION=$APP_VERSION"
        
        echo " "
        echo "Locating downloaded artifact to where GitLab extracted the artifact from the build job..."
        BUILD_PATH="${APP_DIR}/target/*.jar"
        echo "BUILD_PATH=${BUILD_PATH}"
        
        echo " "
        echo "Verifying artifact exists..."
        ls -lh $BUILD_PATH || { echo "ERROR: Artifact not found at $BUILD_PATH!"; exit 1; }
        
        echo " "
        echo "Running xray scan locally on the runner..."
        jf scan $BUILD_PATH --watches=EIS2.0 --fail=true
        echo " "


.upgrade_helm_docker_executor:
    variables:
        GIT_SSL_CAINFO: "/tmp/combined-ca-bundle.crt"
        SSL_CERT_FILE: "/tmp/combined-ca-bundle.crt"
        GIT_SSL_NO_VERIFY: "true"

    before_script: |
        echo -e "${GL_GREEN}Decode gitlab sbi CA into /tmp...${GL_RESET}"
        echo "echo "$INTERNAL_CA_CERT_B64" | base64 -d > /tmp/internal-ca.crt"
        echo "$INTERNAL_CA_CERT_B64" | base64 -d > /tmp/internal-ca.crt

        echo " "
        echo -e "${GL_GREEN}Append your internal CA to UBI's existing system bundle...${GL_RESET}"
        echo "cat /etc/pki/tls/certs/ca-bundle.crt /tmp/internal-ca.crt > /tmp/combined-ca-bundle.crt"
        cat /etc/pki/tls/certs/ca-bundle.crt /tmp/internal-ca.crt > /tmp/combined-ca-bundle.crt
        
        echo " "
        echo -e "${GL_GREEN}Configure identity for automated commits...${GL_RESET}"
        echo "git config --global user.email "gitlab-runner@sbi.co.in""
        echo "git config --global user.name "gitlab-runner""
        git config --global user.email "gitlab-runner@sbi.co.in"
        git config --global user.name "gitlab-runner"

        echo " "
        echo "Logging into harbor registry $HARBOR_REGISTRY..."
        echo "Robot user is $HARBOR_REGISTRY_USERNAME"
        echo "$HARBOR_REGISTRY_PASSWORD" | helm registry login --username 'robot$eis-cicd' "$HARBOR_REGISTRY" --password-stdin --insecure
    script: |
        # Define the exact GitLab log colors
        GL_GREEN='\033[32;1m'
        GL_RESET='\033[0m'

        echo -e "${GL_GREEN}Sourcing release_info.env file...${GL_RESET}"
        echo "source release_info.env"
        source release_info.env
        echo "Release number is $RELEASE_NUMBER"

        echo " "
        echo -e "${GL_GREEN}Cloning blueprint repository for scripts...${GL_RESET}"
        echo "git clone -b ${BLUEPRINT_CHECKOUT_BRANCH} https://ouath2:$GITLAB_TOKEN@gitlab.sbi/centraliseddevsecops/eis_2.0/eis2.0_blueprint1.0.git blueprint_repo"
        git clone -b ${BLUEPRINT_CHECKOUT_BRANCH} https://ouath2:$GITLAB_TOKEN@gitlab.sbi/centraliseddevsecops/eis_2.0/eis2.0_blueprint1.0.git blueprint_repo
  
        echo " "
        echo -e "${GL_GREEN}Generate helm values.yaml files for all nonprod envs...${GL_RESET}"
        echo "chmod 755 blueprint_repo/scripts/$HELM_SCRIPT_NAME"
        chmod 755 blueprint_repo/scripts/$HELM_SCRIPT_NAME
        ./blueprint_repo/scripts/$HELM_SCRIPT_NAME

        echo " "
        echo -e "${GL_GREEN}Update the placeholders in values.yaml using sed commands...${GL_RESET}"
        echo "chmod 755 blueprint_repo/scripts/update_yaml.sh"
        chmod 755 blueprint_repo/scripts/update_yaml.sh
        ./blueprint_repo/scripts/update_yaml.sh

        echo " "
        echo -e "${GL_GREEN}Export kubeconfig file to login to $ENV cluster...${GL_RESET}"
        echo -e "${GL_GREEN}Decode the Base64 variable into a physical file in the /tmp directory...${GL_RESET}"
        echo "echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig.yaml"
        echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig.yaml

        echo " "
        echo -e "${GL_GREEN}Secure the file permissions...${GL_RESET}"
        echo "chmod 600 /tmp/kubeconfig.yaml"
        chmod 600 /tmp/kubeconfig.yaml

        echo " "
        echo -e "${GL_GREEN}Export the path of the physical file...${GL_RESET}"
        echo "export KUBECONFIG=/tmp/kubeconfig.yaml"
        export KUBECONFIG=/tmp/kubeconfig.yaml

        echo " "
        echo -e "${GL_GREEN}Pull the chart from Harbor and unpack it into a local folder...${GL_RESET}"
        echo "helm pull oci://${HARBOR_REGISTRY}/eis2.0/mule-journey --version $SBI_MULE_HELM_VERSION --untar --insecure-skip-tls-verify"
        helm pull oci://${HARBOR_REGISTRY}/eis2.0/mule-journey --version $SBI_MULE_HELM_VERSION --untar --insecure-skip-tls-verify

        echo " "
        echo -e "${GL_GREEN}Use 'sed' to forcefully overwrite the appVersion in the downloaded Chart.yaml...${GL_RESET}"
        echo "sed -i "s/^appVersion:.*/appVersion: \"$RELEASE_NUMBER\"/" mule-journey/Chart.yaml"
        sed -i "s/^appVersion:.*/appVersion: \"$RELEASE_NUMBER\"/" mule-journey/Chart.yaml

        echo " "
        echo -e "${GL_GREEN}Run the upgrade command...${GL_RESET}"
        echo "helm upgrade --install "$RELEASE_NAME" ./mule-journey --namespace $NAMESPACE --insecure-skip-tls-verify -f $FILE_NAME --server-side=false --force-replace"
        helm upgrade --install "$RELEASE_NAME" ./mule-journey --namespace $NAMESPACE --insecure-skip-tls-verify -f $FILE_NAME --server-side=false --force-replace

        echo " "
        echo -e "${GL_GREEN}Cleaning up local mule-journey chart and blueprint repo...${GL_RESET}"
        echo "rm -rf ./mule-journey blueprint_repo"
        rm -rf ./mule-journey blueprint_repo

        echo " "
        echo -e "${GL_GREEN}Wait for $DEPLOY_JOB_SLEEP seconds...${GL_RESET}"
        echo "sleep $DEPLOY_JOB_SLEEP"
        sleep $DEPLOY_JOB_SLEEP

        echo " "
        echo -e "${GL_GREEN}View helm revision details...${GL_RESET}"
        echo "helm list --filter $RELEASE_NAME -n $NAMESPACE"
        helm list --filter $RELEASE_NAME -n $NAMESPACE

        echo " "
        echo -e "${GL_GREEN}View status of pods...${GL_RESET}"
        echo "kubectl get pods -n $NAMESPACE | grep $RELEASE_NAME"
        kubectl get pods -n $NAMESPACE | grep $RELEASE_NAME | awk '{print $1, $2, $3, $5}' | column -t -o "    "
        echo " "

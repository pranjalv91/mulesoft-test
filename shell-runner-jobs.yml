.release_bundle_hotfix:
    rules:
        - if: '( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == "dev" ) || ( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == "main" )'
    script: |
        if [[ "$CI_PIPELINE_SOURCE" == "parent_pipeline" && "$CI_COMMIT_BRANCH" == "dev" ]]; then
          echo "Sourcing latest release_info.env file..."
          source release_info.env
          echo "Release number is $RELEASE_NUMBER"

          echo " "
          echo "Clean the escape characters from RELEASE_NUMBER and exporting to CLEAN_RELEASE_NUMBER..."
          CLEAN_RELEASE_NUMBER=$(echo "$RELEASE_NUMBER" | tr -d '\r\n')
          echo "Clean release number is $CLEAN_RELEASE_NUMBER"

          echo " "
          echo "Exporting CLEAN_RELEASE_NUMBER to JFROG_CLI_BUILD_NUMBER..."
          JFROG_CLI_BUILD_NUMBER="$CLEAN_RELEASE_NUMBER"

          echo " "
          echo "Printing values of release bundle related variables..."
          echo "JFROG_CLI_BUILD_NAME=$JFROG_CLI_BUILD_NAME"
          echo "JFROG_CLI_BUILD_NUMBER=$JFROG_CLI_BUILD_NUMBER"
          echo "JFROG_CLI_BUILD_PROJECT=$JFROG_CLI_BUILD_PROJECT"
          echo "SIGNING_KEY=$SIGNING_KEY"

          echo "Creating release bundle using buildinfo values from release-bundle.json..."
          cat > release-bundle.json <<EOF
          {
            "files": [
              {
                "aql": {
                  "items.find": {
                    "repo": {"\$match": "${JFROG_CLI_BUILD_PROJECT}-*"},
                    "artifact.module.build.name": "${JFROG_CLI_BUILD_NAME}",
                    "artifact.module.build.number": "${JFROG_CLI_BUILD_NUMBER}"
                  }
                }
              }
            ]
          }
        EOF

          echo " "
          echo "Sign release bundle..."
          jf rbc "$JFROG_CLI_BUILD_NAME" "$JFROG_CLI_BUILD_NUMBER" --spec=release-bundle.json --sync=true --project="$JFROG_CLI_BUILD_PROJECT" --signing-key="$SIGNING_KEY"
          echo " "
        fi

        if [[ "$CI_PIPELINE_SOURCE" == "parent_pipeline" && "$CI_COMMIT_BRANCH" == "main" ]]; then
          # Use git log to find the merge commit message details
          MERGE_INFO=$(git log -1 --pretty=%B)
          
          # Extract the source branch name using regex/grep/sed (requires GNU grep with -P)
          # This assumes GitLab default merge commit message format: 'Merge branch 'feature/branch-name' into 'main''
          SOURCE_BRANCH_NAME=$(echo "$MERGE_INFO" | grep -oP "Merge branch '\K[^']+")
          
          echo "Successfully extracted source branch name: $SOURCE_BRANCH_NAME"

          if [[ "$SOURCE_BRANCH_NAME" == hotfix* ]]; then
            echo "Hotfix Merge Request detected ($SOURCE_BRANCH_NAME). Running release bundle creation job..."
            
            echo " "
            echo "Sourcing latest release_info.env file..."
            source release_info.env
            echo "Release number is $RELEASE_NUMBER"

            echo " "
            echo "Clean the escape characters from RELEASE_NUMBER and exporting to CLEAN_RELEASE_NUMBER..."
            CLEAN_RELEASE_NUMBER=$(echo "$RELEASE_NUMBER" | tr -d '\r\n')
            echo "Clean release number is $CLEAN_RELEASE_NUMBER"

            echo " "
            echo "Exporting CLEAN_RELEASE_NUMBER to JFROG_CLI_BUILD_NUMBER..."
            JFROG_CLI_BUILD_NUMBER="$CLEAN_RELEASE_NUMBER"

            echo " "
            echo "Printing values of release bundle related variables..."
            echo "JFROG_CLI_BUILD_NAME=$JFROG_CLI_BUILD_NAME"
            echo "JFROG_CLI_BUILD_NUMBER=$JFROG_CLI_BUILD_NUMBER"
            echo "JFROG_CLI_BUILD_PROJECT=$JFROG_CLI_BUILD_PROJECT"
            echo "SIGNING_KEY=$SIGNING_KEY"

            echo " "
            echo "Creating release bundle using buildinfo values from release-bundle.json..."
            cat > release-bundle.json <<EOF
            {
              "files": [
                {
                  "aql": {
                    "items.find": {
                      "repo": {"\$match": "${JFROG_CLI_BUILD_PROJECT}-*"},
                      "artifact.module.build.name": "${JFROG_CLI_BUILD_NAME}",
                      "artifact.module.build.number": "${JFROG_CLI_BUILD_NUMBER}"
                    }
                  }
                }
              ]
            }
        EOF

            echo " "
            echo "Sign release bundle..."
            jf rbc "$JFROG_CLI_BUILD_NAME" "$JFROG_CLI_BUILD_NUMBER" --spec=release-bundle.json --sync=true --project="$JFROG_CLI_BUILD_PROJECT" --signing-key="$SIGNING_KEY"
            echo " "
          else
            echo "Source branch is $CI_COMMIT_REF_NAME and not hotfix. Skipping this job"
          fi
        fi


.git_commit:
    #This rule implies that the job will only run when the code is commited to dev branch
    rules:
        - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == "dev"'
    script:
        - git config --global user.email "gitlab-runner@sbi.co.in"
        - git config --global user.name "gitlab-runner"
        - git add .
        - git diff --cached --quiet || git commit -am "Update pom.xml version and release version [skip ci]"
        - git push https://ouath2:$GITLAB_TOKEN@gitlab.sbi/$CI_PROJECT_PATH.git HEAD:$CI_COMMIT_BRANCH


#This job is used by all internal and external journeys to tag the existing pipeline build 
.git_release_tag:
    #This rule implies that the job will only run when the code is commited to dev branch
    rules:
        - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == "dev"'
    script: |
        echo "Sourcing release_info.env file..."
        source release_info.env
        echo "Release number is $RELEASE_NUMBER"

        echo " "
        echo "Configuring git email and username..."
        git config --global user.email "gitlab-runner@sbi.co.in"
        git config --global user.name "gitlab-runner"

        echo " "
        echo "Update the remote URL to authenticate with the gitlab token..."
        git remote set-url origin "https://ouath2:$GITLAB_TOKEN@gitlab.sbi/$CI_PROJECT_PATH.git"

        echo " "
        echo "Fetching latest changes from $CI_COMMIT_BRANCH..."
        git fetch origin $CI_COMMIT_BRANCH
        git checkout -f $CI_COMMIT_BRANCH
        git pull origin $CI_COMMIT_BRANCH

        echo " "
        echo "Tagging release with the release version tag..."
        TAG_NAME="${RELEASE_NUMBER}"-"${PIPELINE_ID}"
        git tag -a "$TAG_NAME" -m "Release candidate for ${CI_PROJECT_NAME} with ${TAG_NAME} has been created"

        echo " "
        echo "Push the tag to Gitlab telling it to skip triggering a new CI pipeline..."
        git push -o ci.skip origin "$TAG_NAME"



#This job is used by all internal and external journeys to lint pom for test coverage variable configuration
.lint_pom_test_coverage:
    #This rule implies that the job will only run when the pipeline is triggered due to code merge or if the code is committed to dev branch
    rules:
        - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    script: |
        # Define the exact GitLab log colors
        GL_GREEN='\033[32;1m'
        GL_RESET='\033[0m'

        echo ""
        echo -e "${GL_GREEN}$ echo \"Traversing into app directory...\"${GL_RESET}"
        echo "Traversing into app directory..."
        cd "$APP_DIR"
        echo "Linting pom.xml for test coverage variable line..."
        echo " "
        
        # tr -d ' \t\n\r' strips all spaces, tabs, newlines, and carriage returns 
        # allowing grep to match the exact sequence regardless of formatting
        if tr -d ' \t\n\r' < pom.xml | grep -Fq '<requiredApplicationCoverage>${munit.coverage.min}</requiredApplicationCoverage>'; then
          echo "SUCCESS: Test coverage variable found in pom.xml for $APP_NAME"
          echo "Proceeding to get_version_job for $APP_NAME"
          echo " "
        else
          echo "FAILURE: Test coverage variable is missing from pom.xml for $APP_NAME"
          echo " "
          echo "Hardcoded value of 80 from below line needs to be replaced in pom.xml for $APP_NAME:"
          echo "<requiredApplicationCoverage>80</requiredApplicationCoverage>"
          echo " "
          echo "Replace the hardcoded value with \"\${munit.coverage.min}\" for above line in pom.xml for $APP_NAME"
          echo "Exiting the pipeline"
          echo " "
          exit 1
        fi


#This job is used by all internal and external journeys to get pom version
.get_versions_modified:
    #This rule implies that the job will only run when the pipeline is triggered due to code merge or if the code is commited to dev branch
    rules:
        - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    script: |
        cd "$APP_DIR"

        echo "CI_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE"
        echo "CI_COMMIT_REF_NAME: $CI_COMMIT_REF_NAME"
        echo "CI_COMMIT_BRANCH: $CI_COMMIT_BRANCH"
        
        # Run get_versions as usual for all merge request pipelines
        if [[ "$CI_PIPELINE_SOURCE" == "parent_pipeline" && ("$CI_COMMIT_REF_NAME" =~ ^feature- || "$CI_COMMIT_REF_NAME" =~ ^hotfix- || "$CI_COMMIT_REF_NAME" =~ ^release- ) ]]; then
          echo "Running get version for merge request pipeline"
        fi
        
        if [[ "$CI_PIPELINE_SOURCE" == "parent_pipeline" && "$CI_COMMIT_BRANCH" == "dev" ]]; then
          echo "Running get versions for CI_COMMIT_BRANCH 'dev'"
        fi

        if [[ "$CI_PIPELINE_SOURCE" == "parent_pipeline" && "$CI_COMMIT_BRANCH" == "main" ]]; then
          echo "Running get versions for CI_COMMIT_BRANCH 'main'"
        fi

        # Common steps for all the if blocks
        echo " "
        echo "Get the version from pom.xml..."
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\r\n')
        
        echo " "
        echo "Write VERSION value to $APP_VER.env..."
        echo "$APP_VER=$VERSION" > $APP_VER.env
        
        echo " "
        echo "View the contents of $APP_VER.env..."
        cat $APP_VER.env
    #saves the .env file as an artifact for the next job
    artifacts:
        paths:
            - "$APP_DIR/$APP_VER.env"
        reports:
            dotenv: 
                - "$APP_DIR/$APP_VER.env"


.get_versions_hotfix:
    #This rule implies that the job will only run when the pipeline is triggered due to code merge or if the code is commited to dev branch
    rules:
        - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == "main"'
          changes:
            - "$APP_DIR/**"
            - "$APP_DIR/**/*"
    script: |
        cd "$APP_DIR"
        
        echo "Printng values of rules variables..."
        echo "CI_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE"
        echo "CI_COMMIT_REF_NAME: $CI_COMMIT_REF_NAME"
        echo "CI_COMMIT_BRANCH: $CI_COMMIT_BRANCH"
        
        echo " "
        echo "Extracting source branch name..."
        # Use git log to find the merge commit message details
        MERGE_INFO=$(git log -1 --pretty=%B)
          
        # Extract the source branch name using regex/grep/sed (requires GNU grep with -P)
        # This assumes GitLab default merge commit message format: 'Merge branch 'feature/branch-name' into 'main''
        SOURCE_BRANCH_NAME=$(echo "$MERGE_INFO" | grep -oP "Merge branch '\K[^']+")
          
        echo "Successfully extracted source branch name: $SOURCE_BRANCH_NAME"
          
        if [[ "$SOURCE_BRANCH_NAME" == hotfix* ]]; then
          echo " "
          echo "Hotfix Merge Request detected ($SOURCE_BRANCH_NAME). Adding -hotfix suffix"
            
          echo " "
          echo "Get the version from pom.xml and append hotfix suffix to the version..."
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\r\n')
          HOTFIX_VERSION="${VERSION}-hotfix"
          
          echo " "
          echo "Write HOTFIX_VERSION value to $APP_VER.env..."
          echo "$APP_VER=$HOTFIX_VERSION" > $APP_VER.env
          
          echo " "
          echo "View the contents of $APP_VER.env..."
          cat $APP_VER.env
        else
          echo " "
          echo "Source branch is $CI_COMMIT_REF_NAME and not hotfix. Skipping this job for $APP_NAME"
        fi
    #saves the .env file as an artifact for the next job
    artifacts:
        paths:
            - "$APP_DIR/$APP_VER.env"
        reports:
            dotenv: 
                - "$APP_DIR/$APP_VER.env"



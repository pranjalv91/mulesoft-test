#This job is used by all internal and external journeys to run munit test cases
.mvn_test_job:
    #This rule implies that the job will only run when the pipeline is triggered due to code merge or if the code is commited to dev branch and if the changes are inside the app directory
    rules:
        - if: '( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_REF_NAME =~ /^feature-/ ) || ( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_REF_NAME =~ /^hotfix-/ ) || ( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == "dev" )'
          changes:
            - "$APP_DIR/**"
            - "$APP_DIR/**/*"
    script:
        - cd "$APP_DIR" && mvn clean test -U -Dencryption.key=$ENCRYPTION_KEY -Denv=$MULEENV -DmuleKeyStorePassword=$MULE_KEYSTORE_PASSWORD -DmuleTrustStorePassword=$MULE_TRUSTSTORE_PASSWORD -DmuleKeyStoreAlias=$MULE_KEYSTORE_ALIAS -Dmunit.coverage.min=90


#This job is used by all internal and external journeys to run a remote fortify scan
.fortify_remote_job:
    #This rule implies that the job will only run when the pipeline is triggered due to code merge or if the code is commited to dev branch and if the changes are inside the app directory
    rules:
        - if: '( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_REF_NAME =~ /^feature-/ ) || ( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_REF_NAME =~ /^hotfix-/ ) || ( $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == "dev" )'
          changes:
            - "$APP_DIR/**"
            - "$APP_DIR/**/*"
    script: 
        - cd "$APP_DIR"
        - $FORTIFY_PATH -url "$FORTIFY_CONTROLLER" start -upload -versionid $APP_ID -uptoken "$FORTIFY_TOKEN" -bt "mvn" -pool "00000000-0000-0000-0000-000000000002" #packages the source code along with the fortify configurations and uploads to fortify controller. scan and report generation happens remotely
    allow_failure: true


.xray_hotfix_job:
    #This rule implies that the job will only run when the pipeline is triggered due to code merge or if the code is commited to dev branch and if the changes are inside the app directory
    rules:

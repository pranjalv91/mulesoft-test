        mkdir -p .jfrog/projects
        echo "$JFROG_MAVEN_YAML_B64" | base64 -d | tr -d '\r' > .jfrog/projects/maven.yaml
        
        # CRITICAL FIX: Delete the 'serverId' lines from maven.yaml. 
        # Without a hardcoded server ID, jf mvn will automatically use the JF_ environment variables above.
        sed -i '/serverId:/d' .jfrog/projects/maven.yaml

        echo " "
        echo "Verify generated maven.yaml file contents..."
        cat .jfrog/projects/maven.yaml


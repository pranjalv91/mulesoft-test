          echo "Copying JAR from build path to hotfix path with -hotfix- string appended to JAR file name..."
          SOURCE_INSTALL_PATH="${BASE_M2_PATH}/${GROUP_ID}/${APP_NAME}/${APP_VERSION}"
          DESTINATION_HOTFIX_PATH="${BASE_M2_PATH}/${GROUP_ID}/${APP_NAME}/${APP_VERSION}-hotfix"

          echo " "
          echo "Print SOURCE_PATH and DESTINATION PATH before copying hotfix JAR..."
          echo "SOURCE_INSTALL_PATH=$SOURCE_INSTALL_PATH"
          echo "DESTINATION_HOTFIX_PATH=$DESTINATION_HOTFIX_PATH"

          echo " "
          echo "Copy JAR from SOURCE_INSTALL_PATH to DESTINATION_HOTFIX_PATH..."
          mkdir -p "${DESTINATION_HOTFIX_PATH}" && cp "${SOURCE_INSTALL_PATH}/${APP_NAME}-${APP_VERSION}-mule-application.jar" "${DESTINATION_HOTFIX_PATH}/${APP_NAME}-${APP_VERSION}-hotfix-mule-application.jar"

          echo " "
          echo "Verify JAR under hotfix folder path after copying..."
          ls -lhrt "${DESTINATION_HOTFIX_PATH}"
        else
          echo "MERGE REQUEST SOURCE BRANCH is not hotfix, incrementing pom version ..."
          mvn -q build-helper:parse-version versions:set -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion} versions:commit  #increments the pom patch version by 1

          echo " "
          echo "APP CHANGE - Starting maven build for ${APP_NAME}..."
          JFROG_CLI_BUILD_NAME=$JFROG_CLI_BUILD_NAME JFROG_CLI_BUILD_NUMBER=$JFROG_CLI_BUILD_NUMBER JFROG_CLI_BUILD_PROJECT=$JFROG_CLI_BUILD_PROJECT eval $MAVEN_CMD
        fi

        echo " "
        echo "Storing incremented version in VERSION variable..."
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\r\n') #gets updated version value from the pom.xml
        echo $VERSION

        echo " "
        echo "Exporting updated version as APP_VERSION key in $APP_VER.env file..."
        echo "$APP_VER=$VERSION" > $APP_VER.env #updates version value into the original .env file
        echo "Publish contents of $APP_VER.env file for verification..."
        cat $APP_VER.env





        echo " "
        echo "--- DIAGNOSTICS: Verifying Variables ---"
        echo "URL: $JFROG_CONFIG_URL"
        echo "User: $JFROG_UPLOAD_USER"
        echo "Token Length: ${#JFROG_UPLOAD_ACCESS_TOKEN} characters"
        echo "----------------------------------------"

        echo " "
        echo "Creating Server ID eis2jf..."
        # Note: I swapped the "=" for spaces on the parameters, as CLI v2.78.1 sometimes parses them better
        jf config add eis2jf --url "$JFROG_CONFIG_URL" --user "$JFROG_UPLOAD_USER" --access-token "$JFROG_UPLOAD_ACCESS_TOKEN" --interactive=false --insecure-tls

        echo " "
        echo "Verifying if Server ID was actually saved..."
        # This will force the pipeline to fail immediately here if the server wasn't saved, 
        # rather than waiting for the Maven command to crash.
        jf c show eis2jf || { echo "CRITICAL ERROR: The JFrog CLI completely failed to save the configuration."; exit 1; }





        # --- PASTE THIS IN ITS PLACE ---
        echo " "
        echo "Setting up JFrog Environment..."
        export JFROG_CLI_HOME_DIR="$CI_PROJECT_DIR/.jfrog"
        export JF_HOME="$CI_PROJECT_DIR/.jfrog"
        export JFROG_CLI_LOG_LEVEL=DEBUG
        export JFROG_CLI_AVOID_NEW_VERSION_WARNING=true
        
        # Globally accept the internal corporate certificates
        export JFROG_CLI_INSECURE_TLS=true

        echo " "
        echo "Sanitizing variables to remove hidden Windows carriage returns..."
        CLEAN_JFROG_URL=$(echo "$JFROG_CONFIG_URL" | tr -d '\r\n')

        CLEAN_JFROG_TOKEN=$(echo "$JFROG_UPLOAD_ACCESS_TOKEN" | tr -d '\r\n')

        echo " "
        echo "Bypassing CLI bug: Injecting server config directly into memory..."
        # This officially supported method skips 'jf config add' entirely. 
        # Notice we are appending a strict trailing slash to the URL to satisfy JFrog's validation.
        export JF_ENV_1="serverId=eis2jf;url=${CLEAN_JFROG_URL}/;user=${CLEAN_JFROG_USER};accessToken=${CLEAN_JFROG_TOKEN}"

        echo " "
        echo "Verifying Server ID from memory..."
        jf c show eis2jf || { echo "CRITICAL ERROR: JF_ENV_1 injection failed."; exit 1; }

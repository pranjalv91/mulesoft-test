    echo "JFROG_CLI_BUILD_PROJECT=$JFROG_CLI_BUILD_PROJECT"
    echo "APP_NAME=$APP_NAME"
    
    # POSIX-COMPLIANT FIX: Replace ${!APP_VER} to prevent "bad substitution" in Docker sh
    APP_VERSION=$(eval echo "\$$APP_VER")
    echo "APP_VERSION=$APP_VERSION"

    echo " "
    echo "Traversing into ${APP_DIR} directory..."
    cd "$APP_DIR"

    echo " "
    echo "Generating non-interactive JFrog Maven configuration..."
    # ACTION REQUIRED: Replace 'YOUR-VIRTUAL-REPO' with the actual Artifactory repository name you use to resolve Maven dependencies
    jf mvn-config --server-id-resolve=default-server --repo-resolve-releases=YOUR-VIRTUAL-REPO --repo-resolve-snapshots=YOUR-VIRTUAL-REPO
    
    # DOCKER PATH FIX: /gitrunner_data does not exist inside the Docker container. 
    # Swapped -Dmaven.repo.local to a path inside the container workspace.
    MAVEN_CMD="jf mvn clean install -U -DskipTests -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dartifactory.publish.artifacts=false"

    # If merge request source branch is hotfix then skip the incrementing pom version
    if [[ "$CI_PIPELINE_SOURCE" == "parent_pipeline" && "$CI_COMMIT_REF_NAME" =~ ^hotfix- ]]; then
      echo "MERGE REQUEST SOURCE BRANCH is hotfix, skipping incrementing pom version ..."

      echo " "
